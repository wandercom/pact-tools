app = 'pact-tools'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    timeout = '3s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
